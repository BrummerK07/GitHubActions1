name: Magic 8-Ball Architect

on:
  issues:
    types: [opened]

  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  predict-future:
    runs-on: ubuntu-latest

    steps:
      - name: Post prediction
        uses: actions/github-script@v7
        with:
          script: |
            const answers = [
              "✨ Signs point to yes.",
              "🐛 Reply hazy, try again.",
              "🚀 It is certain.",
              "🔥 My sources say no.",
              "🌌 Outlook good.",
              "💀 Very doubtful."
            ];

            const prediction =
              answers[Math.floor(Math.random() * answers.length)];

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body:
                `## 🔮 The Cosmic GitHub Oracle Has Spoken!\n\n> ${prediction}`
            });
